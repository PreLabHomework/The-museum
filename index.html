<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Tuana Yüzer Museum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Young+Serif&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a0d18;--plum:#3a1733;--bone:#f4eadf;--lip:#b3172d;--orchid:#e58bb8;--brass:#c9a24b;
--px:'Silkscreen',ui-monospace,monospace;--serif:'Young Serif',Georgia,serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0d070d;overflow:hidden;color:var(--bone);font-family:var(--serif);-webkit-user-select:none;user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 0;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font-family:var(--px);font-size:11px;flex-wrap:wrap}
.hud>*{pointer-events:auto}
.chip{background:rgba(26,13,24,.88);border:2px solid var(--brass);padding:6px 8px;color:var(--bone);line-height:1.3}
.grp{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
button{font-family:var(--px);font-size:11px;background:var(--lip);color:var(--bone);border:2px solid var(--bone);padding:7px 9px;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--orchid);outline-offset:2px}
button.ghost{background:rgba(26,13,24,.88);border-color:var(--brass)}
#prompt{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(152px + env(safe-area-inset-bottom,0px));font-family:var(--px);font-size:11px;background:rgba(26,13,24,.92);border:2px solid var(--orchid);padding:6px 10px;display:none;white-space:nowrap}
#dlg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(660px,calc(100% - 20px));background:var(--bone);color:var(--ink);border:4px solid var(--brass);outline:3px solid var(--ink);outline-offset:-9px;padding:18px 20px 16px;display:none;min-height:96px}
#dlg.on{display:block}
#dname{font-family:var(--px);font-size:11px;color:var(--lip);margin-bottom:6px}
#dtext{font-size:16px;line-height:1.5}
#dnext{position:absolute;right:14px;bottom:8px;font-family:var(--px);font-size:11px;color:var(--plum)}
.veil{position:fixed;inset:0;background:rgba(13,7,13,.82);display:none;align-items:center;justify-content:center;padding:16px}
.veil.on{display:flex}
.card{max-width:540px;width:100%;max-height:88vh;overflow:auto;background:var(--bone);color:var(--ink);border:4px solid var(--brass);outline:3px solid var(--ink);outline-offset:-10px;padding:26px 26px 22px;-webkit-user-select:text;user-select:text}
.card h2{margin:0 0 10px;font-size:22px;font-weight:400;line-height:1.2}
.card p{margin:0 0 12px;font-size:16px;line-height:1.55}
.card .cap{font-style:italic;font-size:14px;color:#6b4a5f;margin:-2px 0 12px;line-height:1.4}
.card .fact{border-top:2px dashed #b9a9b2;margin:12px 0 4px;padding-top:10px;font-size:14px;line-height:1.5;color:#3a2c38}
.card .fact span{display:block;font-family:var(--px);font-size:10px;letter-spacing:.12em;color:var(--lip);margin-bottom:4px}
.card .foot{font-family:var(--px);font-size:11px;color:#6b4a5f;margin-top:14px}
.card button{margin-top:6px}
.frag{border-left:4px solid var(--lip);padding-left:10px;margin:0 0 10px;font-size:15px;line-height:1.5}
.frag.locked{border-color:#b9a9b2;color:#8a7a84}
.digits{font-family:var(--px);font-size:26px;letter-spacing:8px;margin:8px 0}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:240px;margin:10px 0}
.pad button{padding:14px 0;font-size:16px}
input,textarea{font-family:var(--px);font-size:14px;padding:10px;width:100%;border:3px solid var(--ink);background:#fff;color:var(--ink);margin:6px 0 10px;-webkit-user-select:text;user-select:text}
textarea{min-height:110px;resize:vertical;font-family:var(--serif);font-size:15px}
#touch{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(16px + env(safe-area-inset-bottom,0px));display:none;justify-content:space-between;align-items:flex-end;pointer-events:none}
#touch>*{pointer-events:auto}
.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px}
.dpad button{padding:0;font-size:18px;background:rgba(58,23,51,.85);border-color:var(--brass)}
.act{width:84px;height:84px;border-radius:50%;font-size:13px}
@media (pointer:coarse){#touch{display:flex}#dlg{bottom:calc(150px + env(safe-area-inset-bottom,0px))}}
#intro{background:radial-gradient(ellipse at center,rgba(13,7,13,.12) 0%,rgba(13,7,13,.8) 100%)}
.titlecard{text-align:center;max-width:740px;padding:20px;animation:rise 1.8s ease both}
.tkick{font-family:var(--px);font-size:12px;letter-spacing:.38em;color:var(--orchid);margin-bottom:14px}
#introTitle{font-family:var(--serif);font-weight:400;font-size:clamp(34px,7.2vw,76px);line-height:1.04;margin:0 0 16px;color:var(--bone);text-shadow:0 3px 0 #1a0d18,0 0 34px rgba(229,139,184,.55)}
.titlecard p{font-size:16px;line-height:1.5;color:#ead9cc;margin:0 0 24px;text-shadow:0 2px 0 #1a0d18}
.titlecard .tfoot{font-family:var(--px);font-size:11px;color:#c9b6c0;margin:20px 0 0}
#start{font-size:13px;padding:12px 18px;animation:pulse 1.9s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(229,139,184,.28)}}
body.title .hud,body.title #touch{display:none!important}
#banner{position:fixed;left:50%;top:70px;transform:translate(-50%,-10px);text-align:center;opacity:0;pointer-events:none;transition:opacity .5s,transform .5s;background:rgba(26,13,24,.9);border:2px solid var(--brass);padding:8px 18px;max-width:92vw}
#banner.on{opacity:1;transform:translate(-50%,0)}
#banner .bk{font-family:var(--px);font-size:13px;letter-spacing:.14em;color:var(--brass);text-transform:uppercase}
#banner .bt{font-family:var(--serif);font-size:15px;color:var(--bone);margin-top:3px}
.nbwrap{position:relative;perspective:1700px;max-width:820px;width:100%}
.nb{display:grid;grid-template-columns:1fr 1fr;background:#fbf3e6;border:4px solid #5c3a22;border-radius:6px;box-shadow:0 14px 34px rgba(0,0,0,.55);min-height:400px;max-height:80vh;overflow:auto;color:#2a2a3a}
.nb .pg{padding:20px 24px 18px;font-family:'Caveat',cursive;font-size:21px;line-height:26px;background:repeating-linear-gradient(transparent 0 25px,rgba(120,150,200,.32) 25px 26px);-webkit-user-select:text;user-select:text}
.nb .pg.l{border-right:2px solid rgba(0,0,0,.16);box-shadow:inset -16px 0 18px -14px rgba(0,0,0,.28)}
.nb .pg.r{box-shadow:inset 16px 0 18px -14px rgba(0,0,0,.28)}
.nb h3{font-family:var(--serif);font-weight:400;font-size:22px;margin:0 0 8px;color:#3a1733;line-height:28px}
.nb .tiny{font-size:17px;line-height:20px;color:#5a4a58}
.nb .ok{color:#b3172d}.nb .miss{color:#8a7a84}
.nb .code{display:flex;gap:6px;margin:8px 0}.nb .code b{width:34px;height:42px;border:2px solid #3a1733;display:flex;align-items:center;justify-content:center;font-size:28px;background:#fff8ee}
.nb .bfs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;text-align:center}
.nb .bfs div{font-size:15px;line-height:16px}
.sheet{position:absolute;top:0;bottom:0;width:50%;background:#fbf3e6;pointer-events:none;display:none;backface-visibility:hidden;box-shadow:0 0 30px rgba(0,0,0,.3)}
.sheet.fwd{right:0;display:block;transform-origin:left center;animation:flipF .52s ease-in-out}
.sheet.back{left:0;display:block;transform-origin:right center;animation:flipB .52s ease-in-out}
@keyframes flipF{from{transform:rotateY(0)}to{transform:rotateY(-180deg)}}
@keyframes flipB{from{transform:rotateY(0)}to{transform:rotateY(180deg)}}
.nbbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:12px;flex-wrap:wrap}
.qopt{font-size:12px!important;line-height:1.4}
@media (max-width:640px){.nb{grid-template-columns:1fr}.sheet{display:none!important}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="title">
<canvas id="c"></canvas>
<div class="hud">
  <div class="chip"><div id="where">The Museum Grounds</div><div id="count" style="color:#e58bb8;margin-top:3px"></div></div>
  <div class="grp"><button class="ghost" id="rbtn">Run: off</button><button class="ghost" id="jbtn">Journal</button><button class="ghost" id="mbtn">Music: off</button><button class="ghost" id="tbtn">Time: auto</button><button class="ghost" id="wbtn">Sky: clear</button></div>
</div>
<div id="prompt"></div>
<div id="banner"></div>
<div id="dlg"><div id="dname"></div><div id="dtext"></div><div id="dnext">E</div></div>
<div id="touch">
  <div class="dpad">
    <span></span><button data-k="up" aria-label="Up">^</button><span></span>
    <button data-k="left" aria-label="Left">&lt;</button><span></span><button data-k="right" aria-label="Right">&gt;</button>
    <span></span><button data-k="down" aria-label="Down">v</button><span></span>
  </div>

</div>
<div class="veil on" id="intro"><div class="titlecard">
  <div class="tkick">A PERMANENT COLLECTION</div>
  <h1 id="introTitle"></h1>
  <p id="introText"></p>
  <button id="start">Enter the museum</button>
  <p class="tfoot">Walk: arrows or WASD. Look and talk: E or Space. Run: hold Shift. On a phone: the pad and the LOOK button. Music starts off.</p>
</div></div>
<div class="veil" id="modal"><div class="card" id="mcard"></div></div>

<script>
'use strict';
/* ==========================================================
   CONTENT. Everything she reads lives in this block.
   Replace the [brackets] with the real stuff.
   TODO: set CODE to the real safe code (4 digits).
   ART OVERRIDES: see the ART section below to drop in real art.
   ========================================================== */
const SITE={
  title:"The Tuana Yüzer Museum",
  intro:"Permanent collection: everything about one visitor. Admission is free. Curated by Hamza. Please touch the exhibits.",
  finalTitle:"Inside the safe",
  finalText:"[Final message goes here. This is the last piece of the letter.]",
  comingSoon:"New exhibit opening soon: Fall Break.",
  wheelTwist:"Plot twist: every slice is yours. [Add when and how you will deliver them.]",
  mailTo:"",   // your email. If set, the mail slot opens her email app addressed to you. If empty, it copies the note.
  pianoHint:"[Hint: play the tune only you two would know.]",
  certTitle:"Honorary Curator",
  certText:"[Something short, warm and funny. She found everything.]"
};
const FALL_BREAK=new Date(2026,9,21);   // October 21, 2026 (approximate. Change this date.)
const daysToBreak=()=>{const t=new Date();t.setHours(0,0,0,0);return Math.round((FALL_BREAK-t)/864e5);};
const FINALE_SECRETS=12;   // secrets needed (with all keepsakes) for the Honorary Curator certificate
const NOTES=["Gurt. That is the whole note.","I still check the clock at 5. Habit.","Today's trivia: tiramisu means 'pick me up.' You do that for me.","Ar ar ar ar.","Coltrane recorded A Love Supreme in one session, in December. I think about that more than I should.","A group of cats is called a clowder. I hope Mirmir and Aşkım are being very clowder-y today.","I notice the small things you do. This is me noticing."];
const POOLS={
guide:["A docent is a volunteer museum guide. I work for treats and the occasional compliment on my posture.","'Museum' comes from the Greek mouseion, a shrine to the Muses. This one has exactly one Muse, and she is currently reading the pedestals.","House rule: if something sparkles, it matters.","Yogurt comes from the Turkish yoğurt, from yoğurmak, 'to knead.' I knead you to visit more often. ...I will see myself out.","Boston's Beehive sits in the basement of a building that was designed to hold a giant circular painting. I am just saying, Boston has range.","Finish the whole museum and you get a certificate. Pet all the cats and you get respect.","If you hear a fake British accent echoing through the halls, that is the visitor. Whateva.",SITE.comingSoon],
gardener:["The beds bloom a little more every day you visit. I do not make the rules. The flowers do.","Tulips came out of the Ottoman world long before Holland. The English word comes from tülbend, the word for turban. The Turkish name is lale.","In the early 1700s the Ottomans named a whole era after tulips. Lale Devri. Imagine being that committed to a flower.","Orchid seeds are as fine as dust, and in the wild they need a fungus partner to sprout. Everyone needs a little help.","Lilies are dangerous to cats. If someone brings you lilies, thank them, then relocate the lilies. Hamza has been briefed.","Someone asked me what grows best in the long run. I said: whatever you keep visiting."],
owl:["I come here at night. If you see a sparkle after dark, walk up to it and look.","Fireflies glow to find each other. The most romantic communication system in nature, and the least subtle.","Down in Boston there is a jazz club in a basement that feels like 1920s Paris. Nobody in there is in a hurry. Neither am I.","The pond holds the moon better than most mirrors do.","Some of the sparkles are secrets. Some are just fireflies. Both deserve a look.","A group of cats is called a clowder. I would join this clowder."],
hamza:()=>["Hi. It is me. I built this for you.","I miss when you came home at 5. So I built a museum instead.",...(daysToBreak()>0?["Fall break is "+daysToBreak()+" days away. I am counting. Do not tell the calendar."]:[]),"Everything in here is something I noticed about you. I notice a lot.","The Us Wing is past the south gate. It opens once you have found "+UNLOCK_AT+" keepsakes.","If a plaque gets you wrong, tell me. I will fix the plaque, not you.","This took an embarrassing number of hours. I would do it again."],
stylist:["Black, pink, and violet. Always. Do not argue.","The Vivienne Westwood orb is the royal orb plus Saturn's rings. Her motto for it: take tradition into the future. A fine motto for a wardrobe.","The three-row pearl choker launched in 1990. Pearls, but make them punk.","The orb even shows up in the anime Nana. Fashion and anime: a stable couple.","Bats are the only mammals capable of true flight. You are legally required to respect them.","Spiders, bats, pumpkin socks. This is not a costume. It is a lifestyle.","The lipstick wall is for admiring, not touching."],
barista:["Tiramisu means 'pick me up.' We serve it to people who need it. You are always welcome.","Buldak is Korean for 'fire chicken.' Please hydrate.","Salça is Turkish tomato or pepper paste. It is the secret behind half of Turkish cooking.","The word 'yogurt' is Turkish. Everything good is Turkish. I have no sources.","Ladyfingers are called savoiardi in Italian, after the House of Savoy, and they have been around since at least the 1400s.","We are out of everything except love and yogurt.","Tutku means 'passion' in Turkish. Also: biscuit. The cafe takes no position on which matters more."],
projectionist:["Serial Experiments Lain premiered in July 1998, ran 13 episodes, and still feels like it is from the future.","Fleabag began as a one-woman show at the Edinburgh Fringe in 2013. There is a fox. Everyone has theories. Nobody has answers.","The Stuart show is real. It is on HBO Max. Stuart Bloom runs a comic-book store with a portal to other universes in the back room.","Five Nights at Freddy's came out on August 8, 2014. Freddy's music box plays a tune from Bizet's opera Carmen.","Dio is not in Steel Ball Run. A lookalike named Diego is. Please do not ask me to explain the multiverse.","Aizen takes off his glasses and the entire internet takes notes.","The terminal in the corner keeps asking me something. Something about the present day."],
maestro:["Coltrane recorded A Love Supreme in a single session on December 9, 1964. One session.","Chet Baker sang the way he played: softly, without showing off. They called him the Prince of Cool.","Tchaikovsky smuggled a celesta in from Paris and begged his publisher to keep it quiet. The Sugar Plum Fairy's sound was a top-secret operation.","The 1812 Overture asks for real cannons. Somewhere, a concert hall had to schedule that.","My Chemical Romance toured The Black Parade in black marching uniforms. The title song hit number one in the UK.","Hamilton took seven years to write and started on a beach vacation. Take vacations.","The piano is right there. It is easier than it looks. The keys glow."],
labtech:["The double helix was published in 1953. A pairs with T, C pairs with G. Everybody needs a match.","Graphene was isolated with Scotch tape. Nobel Prize, 2010. One of the winners also levitated a frog.","Wet lab rule: label everything. Dry lab rule: label everything harder.","Somebody around here is pre-med and EE. That is two degrees' worth of brain. Please do not ask me for help.","Materials science is asking atoms nicely and watching what they do."],
scholar:["Tulips came to Europe from the Ottoman world. The English word comes from tülbend, 'turban.'","Turkish was written in the Arabic script until 1928, when the Latin alphabet took over.","Turquoise means 'Turkish.' The stone passed through Turkey on its way to Europe.","A cat named Gli lived in Hagia Sophia and became world famous. Istanbul's street cats are legendary.","Three words worth knowing: aşkım, 'my love.' Tutku, 'passion.' Gül, 'rose.' Use them on someone."],
cats:["Mrrp.","The cat looks at you like you owe it money.","A group of cats is called a clowder. This is a clowder of one.","Cats sleep most of the day. This one is practicing.","Cats cannot taste sweetness. This one is unbothered by tiramisu.","In Turkish, 'kedi' means cat. This cat does not answer to it.","The cat blinks slowly. That means I love you, in cat.","Purrrr."]
};
const PIANO_TUNE=[2,2,3,4,4,3,2,1];  // notes 0..7 = C D E F G A B C. Change this to the tune you want her to find.
const CODE="260106";    // six digits. They are found in Concert Hall, Greenhouse, Screening Room, Lab, Wardrobe, Cafe (in that order).
const UNLOCK_AT=6;      // keepsakes needed to open the garden gate to the Us Wing

/* pal: [floorA, floorB, accent, wall]   floor: planks|checker|tile|mosaic|carpet|brick
   ex: exhibits. With x,y they get a pedestal. Without, they attach to a prop through o:{ex:index}. */
const ROOMS={
hall:{name:'The Hall',floor:'checker',pal:['#efe3d6','#e2d2c0','#b3172d','#7a2b3a'],
  props:[['rug',6,5,12,9,{c:['#b3172d','#8d1024']}],['col',3,3,1,3],['col',20,3,1,3],['col',3,10,1,3],['col',20,10,1,3],
   ['desk',8,4,8,2,{ex:0}],['poster',3,1,3,2,{kind:'map',ex:1}],['mail',18,4,1,1,{ex:2}],['banner',7,0,1,3],['banner',16,0,1,3],['plant',1,13,1,1],['plant',22,13,1,1],['plant',1,4,1,1],['mural',8,0,8,3],['museumbench',5,8,2,1],['museumbench',17,8,2,1]],
  ex:[{title:'Welcome',cap:"Information desk, est. 2026. Staffed by one very biased curator.",text:"This museum has one visitor and one curator, and the curator is extremely biased. Everything here is about you. Look around, talk to people, pet the cats, and read the little signs. The Us Wing is past the south garden gate.",fact:"The word 'museum' comes from the Greek mouseion, a shrine to the Muses. This one is dedicated to one specific muse.",act:'survey'},
      {title:'Map',cap:"Floor plan, not to scale. Romantic distances not shown.",text:"North: the Hall, the Greenhouse, the Screening Room. West: Concert Hall, the Lab. East: the Wardrobe, the Cafe. South: Plush Room, Turkish Wing, and a garden gate that opens once you have found six keepsakes."},
      {title:'Mail slot',cap:"Mail slot, brass. Answered within one to three heartbeats.",text:"Leave the curator a note. He reads every one."}],
  npcs:[{name:'Docent',x:12,y:8,pal:'docent',lines:["Welcome to the museum. I am the docent. I work for treats.","Every wing hides one keepsake. Find "+UNLOCK_AT+" and the garden gate to the south will open.","Some things only shine at night. Some things only cat people find.","If you hear a fake British accent echoing through the halls, that is the visitor. Whateva.",SITE.comingSoon]}]},
concert:{name:'Concert Hall',floor:'planks',pal:['#3b1a2b','#331524','#d9a441','#4a1f38'],
  props:[['stage',5,3,10,2],['curtain',5,0,10,3,{c:'#5a1526'}],['piano',11,3,3,2],['shelf',1,2,4,2,{kind:'vinyl'}],['shelf',19,2,4,2,{kind:'vinyl'}],['rug',5,6,14,7,{c:['#5a1526','#d9a441']}],
   ['round',3,9,2,2],['round',20,9,2,2],['lamp',1,6,1,1],['lamp',22,6,1,1],['window',16,0,2,2],['neon',1,0,4,2,{text:'JAZZ',rgb:'255,79,163'}],['jazzposter',19,0,2,2],['recordwall',21,0,2,2],['speaker',15,3,1,2],['speaker',4,4,1,2],['stool',5,9,1,1],['stool',18,9,1,1]],
  ex:[{title:'Jazz',sp:'sax',icon:'note',x:7,y:7,cap:"Tenor saxophone, brass. On loan from: a very good record collection.",text:"Chet Baker and John Coltrane. Coltrane for the nights that need depth. Chet Baker for the nights that need softness.",fact:"Coltrane recorded all of A Love Supreme in a single session on December 9, 1964. A Love Supreme. December. I noticed."},
      {title:'Metal',sp:'guitar',icon:'star',x:16,y:7,cap:"Electric guitar, red, mildly alarming.",text:"The loud wing of the museum. Fast, honest, and best enjoyed at a volume that rattles the pedestal. [Add the band.]"},
      {title:'My Chemical Romance',sp:'drum',icon:'heart',x:11,y:9,cap:"Marching snare drum. Uniform: black. Attitude: parade.",text:"The Black Parade, live in Boston. She knew every word. [Add the moment you remember.]",fact:"The title song was nearly called 'The Five of Us Are Dying.' On tour the band wore black marching uniforms, and the single went to number one in the UK."},
      {title:'Tchaikovsky',sp:'nutcracker',icon:'note',x:7,y:11,cap:"Nutcracker, oak, on guard since 1892.",text:"The Nutcracker and the 1812 Overture. Sugar and cannons. Both are on the menu.",fact:"Tchaikovsky found the celesta in Paris and begged his publisher to keep it secret so no rival could use it first. The 1812 Overture asks for real cannons."},
      {title:'Hamilton',sp:'quill',icon:'star',x:16,y:11,cap:"Quill and inkwell. Do not throw away.",text:"The opening number, the one about the orphan from the islands. She knows the rest.",fact:"Lin-Manuel Miranda read Ron Chernow's biography on vacation and saw hip-hop songs 'rising off the page.' Seven years later: 11 Tonys and a Pulitzer."}],
  keep:{x:21,y:13,text:"[Letter fragment 1]",digit:0},secrets:[{id:'s5',x:2,y:13}]},

const sprDim=n=>{const sp=SPR[n];return Array.isArray(sp)?[32,32]:[sp.grid[0].length,sp.grid.length];};
function sprite(name,x,y,sc,outline){
  const sp=SPR[name];if(!sp)return;
  if(!Array.isArray(sp)){const R_=sp.grid;for(let j=0;j<R_.length;j++)for(let i=0;i<R_[j].length;i++){const ch=R_[j][i];if(ch!=='.'){g.fillStyle=PC[ch]||'#ff00ff';g.fillRect(Math.round(x+i*sc),Math.round(y+j*sc),sc,sc);}}return;}
  const draw=(ox,oy,force)=>{
    const px=(c,ax,ay,aw,ah)=>{g.fillStyle=force||PC[c]||c;g.fillRect(Math.round(x+ox+ax*sc),Math.round(y+oy+ay*sc),Math.max(1,Math.round(aw*sc)),Math.max(1,Math.round(ah*sc)));};
    for(const q of sp){const t=q[0];
      if(t==='r')px(q[1],q[2],q[3],q[4],q[5]);
      else if(t==='l'){const x1=q[2],y1=q[3],x2=q[4],y2=q[5],n=Math.max(Math.abs(x2-x1),Math.abs(y2-y1))||1;for(let i=0;i<=n;i++)px(q[1],Math.round(x1+(x2-x1)*i/n),Math.round(y1+(y2-y1)*i/n),1,1);}
      else{const cx=q[2],cy=q[3],rx=q[4],ry=q[5];for(let j=-Math.ceil(ry);j<=Math.ceil(ry);j++)for(let i=-Math.ceil(rx);i<=Math.ceil(rx);i++){const v=(i*i)/(rx*rx)+(j*j)/(ry*ry);if(t==='d'?v<=1:(v<=1&&v>.5))px(q[1],cx+i,cy+j,1,1);}}}
  };
  if(outline){for(const o of [[-1,0],[1,0],[0,-1],[0,1]])draw(o[0],o[1],'#1a0d18');}
  draw(0,0,null);
}

  if(s==='brick'){for(let y=rh;y<H-3;y+=4){F(shade(b.wall,-.15),0,y,W,1);for(let x=(y/4)%2?0:4;x<W;x+=8)F(shade(b.wall,-.15),x,y,1,4);}}

  if(s==='marquee'){F('#0d070d',W/2-40,rh-14,80,14);F('#f7d36a',W/2-40,rh-14,80,1);for(let x=W/2-40;x<W/2+40;x+=6){F(((x/6)|0)%2?'#f7d36a':'#ffffff',x,rh-15,3,3);F(((x/6)|0)%2?'#ffffff':'#f7d36a',x,rh-2,3,3);}F('#b3172d',W/2-34,rh-11,68,7);}
  if(s==='gothic'){for(const x of [0,W-8]){F('#1c1024',x,-6,8,rh+6);F('#2a1834',x+3,-12,2,8);F('#c98bf0',x+3,6,2,4);}}

  const W=60,H=54,T=new Uint8Array(W*H),solid=new Uint8Array(W*H);

  const gt=(x,y)=>x<0||y<0||x>=W||y>=H?0:T[y*W+x];

  rect(9,23,13,1,1);rect(38,23,13,1,1);rect(9,35,1,6,1);rect(50,35,1,6,1);rect(22,38,1,3,1);rect(9,40,42,1,1);rect(39,24,6,6,4);for(const b of BLD){if(b.w%2===0){const d=doorOf(b);rect(d[0]-1,d[1]+1,1,1,1);}}
  rect(29,41,2,3,1);rect(25,43,11,1,1);rect(25,43,1,7,1);rect(35,43,1,7,1);rect(25,49,11,1,1);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(((x-18)/4.6)**2+((y-28)/3.3)**2<1)T[y*W+x]=3;
  const inB=(x,y,m)=>BLD.some(b=>x>=b.x-m&&x<b.x+b.w+m&&y>=b.y-m&&y<b.y+b.h+m);
  // NPC spawns and cats (kept clear of trees)
  const spots=[[29,20],[41,28],[18,24],[22,6],[33,20],[14,12],[22,26],[17,33],[24,39],[44,36],[33,42],[12,25],[12,30]];
  const clear=(x,y)=>spots.some(s=>Math.abs(s[0]-x)<2&&Math.abs(s[1]-y)<2);
  const trees=[],res=(x,y)=>{for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++)if(gt(x+i,y+j)!==0)return true;return false;};
  seed=77;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    if(gt(x,y)!==0)continue;

    const border=x<3||x>=W-3||y<3||y>=H-3;
    if(border){trees.push({x,y,k:(x*7+y*3)%3===0?1:0});continue;}
    if(inB(x,y,2)||res(x,y)||clear(x,y))continue;
    if(rnd()<.075)trees.push({x,y,k:rnd()<.12?2:(rnd()<.4?1:0)});
  }
  const tset=new Set(trees.map(t=>t.x+','+t.y));
  // flowers
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(gt(x,y)===0&&!tset.has(x+','+y)&&!inB(x,y,0)){
    const inGarden=x>=22&&x<=38&&y>=41&&y<=50;if(hrnd(x,y,5)<(inGarden?.32:.07))T[y*W+x]=5+Math.floor(hrnd(x,y,6)*4);}

  const edge=(x,y,c)=>{if(gt(x,y-1)===0||gt(x,y-1)>=5)F(c,x*16,y*16,16,1);if(gt(x,y+1)===0||gt(x,y+1)>=5)F(c,x*16,y*16+15,16,1);if(gt(x-1,y)===0||gt(x-1,y)>=5)F(c,x*16,y*16,1,16);if(gt(x+1,y)===0||gt(x+1,y)>=5)F(c,x*16+15,y*16,1,16);};
  const waters=[];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const v=T[y*W+x];let im;
    if(v===0)im=grass(x,y);else if(v===1)im=OVR['tile:path']||TEX.path;else if(v===2)im=OVR['tile:plaza']||TEX.plaza;else if(v===3){im=OVR['tile:water']||TEX.water0;waters.push([x,y]);}else if(v===4)im=OVR['tile:brick']||TEX.brick;else im=TEX['flower'+(v-5)];
    g.drawImage(im,x*16,y*16);
    if(v===1)edge(x,y,'#b8a274');if(v===2)edge(x,y,'#b3a382');if(v===4)edge(x,y,'#8a4630');
    if(v===3){const nb=(a,b)=>gt(a,b)!==3;if(nb(x,y-1))F('#e6d9a8',x*16,y*16,16,2);if(nb(x,y+1))F('#e6d9a8',x*16,y*16+14,16,2);if(nb(x-1,y))F('#e6d9a8',x*16,y*16,2,16);if(nb(x+1,y))F('#e6d9a8',x*16+14,y*16,2,16);}}
  // solids
  for(let i=0;i<W*H;i++)if(T[i]===3)solid[i]=1;
  const setS=(x,y,w,h)=>{for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)if(i>=0&&j>=0&&i<W&&j<H)solid[j*W+i]=1;};
  const warps={},drawables=[],lights=[];
  for(const t of trees)setS(t.x,t.y,1,1);
  for(const b of BLD){setS(b.x,b.y,b.w,b.h);const [dx,dy]=doorOf(b);const dxs=b.w%2===0?[dx-1,dx]:[dx];for(const q of dxs){solid[dy*W+q]=0;warps[q+','+dy]={to:b.id,tx:11,ty:14,dir:'up'};}b.img=mkBuilding(b);lights.push({x:dx-(b.w%2===0?.5:0),y:dy+.5,r:34,warm:1});
    drawables.push({y:(b.y+b.h)*16,x:b.x*16,w:b.w*16,draw:()=>{g.drawImage(b.img,b.x*16,b.y*16-24);}});}
  const inter=[];
  // objects
  const obj=(img,tx,ty,ox,oy,w,h,sol)=>{const im=TEX[img];drawables.push({y:(ty+h)*16,x:tx*16,w:w*16,draw:()=>{g.drawImage(im,tx*16+ox,ty*16+oy);}});if(sol)setS(tx,ty,w,h);};
  for(const t of trees)drawables.push({y:(t.y+1)*16,x:t.x*16,w:16,draw:()=>{g.drawImage(TEX['tree'+t.k],t.x*16,t.y*16-12);}});
  const lamps=[[28,15],[31,15],[28,22],[31,22],[28,36],[31,36],[26,44],[34,44],[39,24],[44,24],[20,12],[38,12]];
  for(const [x,y] of lamps){obj('lamp',x,y,4,-8,1,1,true);lights.push({x,y:y-.4,r:40,warm:1});}
  obj('fountain',29,18,0,0,2,2,true);lights.push({x:30,y:19,r:44,warm:0});
  obj('bench',41,27,0,0,2,1,true);obj('bench',34,13,0,0,2,1,true);
  obj('sign',27,12,0,-4,1,1,true);obj('sign',42,25,0,-4,1,1,true);
  for(let x=22;x<=38;x++){for(const y of [41,50]){if(y===41&&(x===29||x===30))continue;obj('fence',x,y,0,0,1,1,true);}}
  for(let y=42;y<=49;y++){obj('fence',22,y,0,0,1,1,true);obj('fence',38,y,0,0,1,1,true);}
  // gate
  const gateSolid=()=>!gateOpen();
  drawables.push({y:42*16,x:29*16,w:32,draw:()=>{g.drawImage(TEX[gateOpen()?'gate1':'gate0'],29*16,41*16);}});
  inter.push({x:29,y:41,w:2,h:1,kind:'gate'},{x:29,y:18,w:2,h:2,kind:'secret',ref:'s1'},{x:41,y:27,w:2,h:1,kind:'secret',ref:'s2'},
    {x:27,y:12,w:1,h:1,kind:'sign',title:'Signpost',text:"North: the Hall, the Greenhouse, the Screening Room. West: Concert Hall, the Lab. East: the Wardrobe, the Cafe. South: Plush Room, Turkish Wing, and a garden gate."},
    {x:42,y:25,w:1,h:1,kind:'sign',title:'Boston Corner',text:"A small brick corner that is not Boston, but is trying. [Add a line about the real one.]"});
  const secretsWorld=SECRETS.filter(s=>s.scene==='world'&&s.x!==undefined);
  for(const s of secretsWorld)if(s.id!=='s1'&&s.id!=='s2')inter.push({x:s.x,y:s.y,w:1,h:1,kind:'secret',ref:s.id});
  const ff=[];for(let i=0;i<120;i++){let x,y,t=0;do{x=3+Math.floor(Math.random()*(W-6));y=3+Math.floor(Math.random()*(H-6));t++;}while(t<40&&(T[y*W+x]!==0||solid[y*W+x]||tset.has(x+','+y)));ff.push({x:x*16+8,y:y*16+8,ph:Math.random()*6.28,sp:.4+Math.random()*.8});}
  return {ff,id:'world',name:'The Museum Grounds',w:W,h:H,solid,bg,warps,drawables,lights,inter,waters,gateSolid,outdoor:true,npcs:[],spawn:[30,12]};

function roomScene(id){
  const r=ROOMS[id],W=24,H=16,solid=new Uint8Array(W*H),bg=mk(W*16,H*16);
  for(let y=0;y<3;y++)for(let x=0;x<W;x++)solid[y*W+x]=1;
  const props=[],inter=[];
  r.props.forEach(p=>props.push({t:p[0],x:p[1],y:p[2],w:p[3],h:p[4],o:Object.assign({},p[5]||{})}));
  r.ex.forEach((e,i)=>{if(e.x!==undefined)props.push({t:'ped',x:e.x,y:e.y,w:1,h:1,o:{ex:i,icon:e.icon,sp:e.sp,title:e.title}});});
  props.forEach(p=>{if(p.o.ex!==undefined){const e=r.ex[p.o.ex];p.o.key=id+':'+p.o.ex;p.o.icon=p.o.icon||e.icon;inter.push({x:p.x,y:p.y,w:p.w,h:p.h,kind:({crt:'term',mail:'mail'})[p.t]||'ex',ref:p.o.ex});}
    if(p.t==='piano')inter.push({x:p.x,y:p.y,w:p.w,h:p.h,kind:'piano'});
    if(p.t==='ped'){p.o.base=r.pal[2];p.o.key=p.o.key||id+':'+p.o.ex;}
    if(p.t==='safe')inter.push({x:p.x,y:p.y,w:p.w,h:p.h,kind:'safe'});
    if(SOLID.has(p.t))for(let j=p.y;j<p.y+p.h;j++)for(let i=p.x;i<p.x+p.w;i++)if(j>=3&&i>=0&&i<W&&j<H)solid[j*W+i]=1;});
  // background
  const t0=floorTile(r.floor,r.pal[0],r.pal[1],0),t1=floorTile(r.floor,r.pal[0],r.pal[1],1);
  g=bg.getContext('2d');
  for(let y=3;y<H;y++)for(let x=0;x<W;x++)g.drawImage((x+y)%2?t1:t0,x*16,y*16);
  for(const p of props)if(FLOORDECO.has(p.t))DRAW[p.t](p.x*16,p.y*16,p.w,p.h,p.o,0);
  F(r.pal[3],0,0,W*16,48);for(let x=0;x<W*16;x+=8)F(shade(r.pal[3],-.08),x,0,1,32);F(shade(r.pal[3],-.28),0,32,W*16,16);F(shade(r.pal[3],-.4),0,31,W*16,1);F(r.pal[2],0,30,W*16,2);F('rgba(0,0,0,.25)',0,48,W*16,3);
  for(const p of props)if(WALL.has(p.t)){const o=OVR['prop:'+p.t];if(o)g.drawImage(o,p.x*16,p.y*16,p.w*16,p.h*16);else DRAW[p.t](p.x*16,p.y*16,p.w,p.h,p.o,0);}
  for(const p of props)if(p.t==='window'){const px=p.x*16,py=(p.y+p.h)*16;g.fillStyle='rgba(255,244,190,.10)';g.beginPath();g.moveTo(px+3,py);g.lineTo(px+p.w*16-3,py);g.lineTo(px+p.w*16+44,py+112);g.lineTo(px+22,py+112);g.closePath();g.fill();}
  F('#6b2a3a',11*16+2,15*16+2,28,14);F('#c9a24b',11*16+4,15*16+4,24,1);F('#c9a24b',11*16+4,15*16+8,24,1);
  const drawables=props.filter(p=>!WALL.has(p.t)&&!FLOORDECO.has(p.t)).map(p=>({y:(p.y+p.h)*16,x:p.x*16,w:p.w*16,draw:(t)=>{const o=OVR['prop:'+p.t];if(o)g.drawImage(o,p.x*16,p.y*16+p.h*16-o.height*(p.w*16/o.width),p.w*16,o.height*(p.w*16/o.width));else DRAW[p.t](p.x*16,p.y*16,p.w,p.h,p.o,t);}}));
  const warps={'11,15':{to:'world',exit:true},'12,15':{to:'world',exit:true}};
  if(r.keep){r.keep.id=id;inter.push({x:r.keep.x,y:r.keep.y,w:1,h:1,kind:'keep',ref:id});}
  (r.secrets||[]).forEach(s=>inter.push({x:s.x,y:s.y,w:1,h:1,kind:'secret',ref:s.id}));
  return {id,name:r.name,w:W,h:H,solid,bg,warps,drawables,lights:[],inter,outdoor:false,npcs:[],spawn:[11,14]};
}
function getScene(id){if(!SC[id])SC[id]=id==='world'?worldScene():roomScene(id);return SC[id];}

function rleToCanvas(rows,colorOf){const dec=rows.map(r=>{let o='',i=0;while(i<r.length){const ch=r[i++];let n='';while(i<r.length&&r[i]>='0'&&r[i]<='9')n+=r[i++];o+=ch.repeat(n?+n:1);}return o;});const c=mk(dec[0].length,dec.length),cg=c.getContext('2d');dec.forEach((q,j)=>{for(let i=0;i<q.length;i++){const ch=q[i];if(ch!=='.'){cg.fillStyle=colorOf(ch);cg.fillRect(i,j,1,1);}}});return c;}
const flipC=c=>{const o=mk(c.width,c.height),og=o.getContext('2d');og.translate(c.width,0);og.scale(-1,1);og.drawImage(c,0,0);return o;};
function personSet(name){if(CHC[name])return CHC[name];const a=CHARART[name];if(!a)return null;const col=ch=>a.pal[ch]||'#ff00ff',st={};for(const d of ['down','up','left'])st[d]=a.frames[d].map(r=>rleToCanvas(r,col));st.right=st.left.map(flipC);return CHC[name]=st;}
function drawPerson(name,x,y,dir,st){const set=personSet(name);if(!set)return false;F('rgba(0,0,0,.28)',x+3,y+13,10,3);g.drawImage(set[dir][st||0],x-2,y-14);return true;}
function drawCat(x,y,dir,st,col,pat){const key=col+'|'+(pat||'');let set=CATC[key];if(!set){const pal={a:col,b:shade(col,.28),c:shade(col,-.3),d:pat||col,e:'#f7d36a',f:'#e58bb8',w:'#d8d8e0',k:'#1a0d18'};const l=CATART.frames.map(r=>rleToCanvas(r,ch=>pal[ch]||'#ff00ff'));set=CATC[key]={left:l,right:l.map(flipC)};}
  const left=dir==='left'||dir==='up';F('rgba(0,0,0,.25)',x+2,y+13,12,3);g.drawImage((left?set.left:set.right)[st?1:0],x-2,y+2);}

const P={tx:30,ty:12,px:480,py:192,dir:'down',mv:null,st:0,wt:0};
const ents=[];let cur=[];
function spawnEnts(sc){
  const arr=[];
  if(sc.id==='world'){
    arr.push({kind:'npc',name:'Hamza',x:32,y:15,pal:'hamza',pool:'hamza'});
    arr.push({kind:'npc',name:'Night Owl',x:19,y:23,pal:'visitor',pool:'owl'});
    arr.push({kind:'npc',name:'Gardener',x:13,y:12,pal:'gardener',wander:2,pool:'gardener'});
    [[17,33,'#f2f2f2'],[24,39,'#e8b06a'],[44,36,'#9a9aa8'],[33,42,'#3a3540'],[26,26,'#e5c9a0']].forEach((c,i)=>arr.push({kind:'cat',name:'Cat',x:c[0],y:c[1],col:c[2],wander:3,gate:i===3}));
  }else{
    const r=ROOMS[sc.id];(r.npcs||[]).forEach(n=>arr.push(Object.assign({kind:'npc'},n)));(r.cats||[]).forEach(c=>arr.push({kind:'cat',name:c.name||'Cat',x:c.x,y:c.y,col:c.col,pat:c.pat,wander:2}));
  }
  return arr.map(o=>Object.assign({tx:o.x,ty:o.y,hx:o.x,hy:o.y,px:o.x*16,py:o.y*16,dir:'down',mv:null,st:0,wt:1+Math.random()*3},o));
}
function solidAt(sc,x,y){if(x<0||y<0||x>=sc.w||y>=sc.h)return true;if(sc.solid[y*sc.w+x])return true;
  if(sc.id==='world'&&(x===29||x===30)&&y===41&&!gateOpen())return true;return false;}
function entAt(x,y,skip){for(const e of cur){if(e===skip)continue;if((e.tx===x&&e.ty===y)||(e.mv&&e.mv.tx===x&&e.mv.ty===y))return e;}
  if(skip!==P&&((P.tx===x&&P.ty===y)||(P.mv&&P.mv.tx===x&&P.mv.ty===y)))return P;return null;}
const DIRV={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
function beginMove(e,d){e.dir=d;const v=DIRV[d],nx=e.tx+v[0],ny=e.ty+v[1];if(solidAt(SCN,nx,ny)||entAt(nx,ny,e))return false;e.mv={tx:nx,ty:ny,t:0};return true;}
function stepEnt(e,dt,speed){if(!e.mv)return false;e.mv.t+=dt/speed;e.wt+=dt;const k=Math.min(1,e.mv.t),sx=e.tx*16,sy=e.ty*16;e.px=lerp(sx,e.mv.tx*16,k);e.py=lerp(sy,e.mv.ty*16,k);e.st=(Math.floor(e.mv.t*2)%2)+1;
  if(e.mv.t>=1){e.tx=e.mv.tx;e.ty=e.mv.ty;e.px=e.tx*16;e.py=e.ty*16;e.mv=null;e.st=0;return true;}return false;}

const keys={};

  if(titleMode&&$('#intro').classList.contains('on')&&!e.repeat&&!['Shift','Control','Alt','Meta','Tab'].includes(e.key)){$('#start').click();e.preventDefault();return;}
  if(window._pk&&!e.repeat)window._pk(e.key);

  if(e.key==='e'||e.key==='E'||e.key===' '||e.key==='Enter'){if(!e.repeat)act();e.preventDefault();}
  if(e.key==='Escape'&&modalOpen&&!$('#intro').classList.contains('on'))closeModal();});

    else if(f.t==='note'){F(f.c,x,y+3,2,2);F(f.c,x+1,y,1,4);F(f.c,x+2,y,1,1);}
    else if(f.t==='heart'){F(f.c,x+1,y,1,1);F(f.c,x+3,y,1,1);F(f.c,x,y+1,5,1);F(f.c,x+1,y+2,3,1);F(f.c,x+2,y+3,1,1);}
    else if(f.t==='steam'){const r=1+k*3;F('rgba(255,255,255,'+(a*.45).toFixed(2)+')',x-r,y-r,r*2,r*2);}
    else if(f.t==='bubble'){F('rgba(191,230,245,'+a.toFixed(2)+')',x,y,3,1);F('rgba(191,230,245,'+a.toFixed(2)+')',x,y+2,3,1);F('rgba(191,230,245,'+a.toFixed(2)+')',x,y,1,3);F('rgba(191,230,245,'+a.toFixed(2)+')',x+2,y,1,3);}
    else if(f.t==='spark'){const tw=Math.sin(k*Math.PI);F(f.c,x,y,1,1);if(tw>.6){F(f.c,x-1,y,3,1);F(f.c,x,y-1,1,3);}}
    else if(f.t==='petal'){F('rgba(247,168,200,'+Math.min(1,a*2).toFixed(2)+')',x,y,2,1);F('#ffe0ec',x,y,1,1);}
    else if(f.t==='mote'){F('rgba(255,233,168,'+(Math.sin(k*Math.PI)*.55).toFixed(2)+')',x,y,1,1);}}
}

/* ==================== RENDER ==================== */
const cv=$('#c'),ctx=cv.getContext('2d');const lightC=mk(1,1),lg=lightC.getContext('2d');
let Z=3,VW=480,VH=270;
function resize(){const w=innerWidth,h=innerHeight;Z=Math.max(2,Math.round(Math.min(w/400,h/300)));VW=Math.ceil(w/Z);VH=Math.ceil(h/Z);cv.width=VW;cv.height=VH;lightC.width=VW;lightC.height=VH;}
addEventListener('resize',resize);
let last=performance.now(),T=0,_dt=.016;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;_dt=dt;
  update(dt);render();requestAnimationFrame(frame);
}
function update(dt){
  tickDL(dt);updateFX(dt);
  if(pendingFinale&&!busy()){pendingFinale=false;showCert();}
  {const dd=new Date();if(dd.getHours()===17&&!busy()&&st.five!==dd.toLocaleDateString('en-CA')&&SCN&&SCN.id==='world'){st.five=dd.toLocaleDateString('en-CA');save();say('Curator',["It is 5 o'clock.","Welcome home. Tell me about your day."]);}}
  if(fade){fade.t+=dt*3.2;if(fade.phase===0&&fade.t>=1){fade.cb();fade.phase=1;fade.t=0;}else if(fade.phase===1&&fade.t>=1)fade=null;}
  const dirKey=keys.up?'up':keys.down?'down':keys.left?'left':keys.right?'right':null;
  if(!P.mv&&!busy()&&dirKey){if(!beginMove(P,dirKey)){}}
  if(P.mv&&!fade){if(stepEnt(P,dt,(keys.sprint||runMode)?.075:.17))arrive();}
  for(const e of cur){
    if(e.wander&&!e.mv&&!(DL&&DL.name===e.name)){e.wt-=dt;if(e.wt<=0){e.wt=1.2+Math.random()*3;const d=['up','down','left','right'][Math.floor(Math.random()*4)],v=DIRV[d],nx=e.tx+v[0],ny=e.ty+v[1];
      if(Math.abs(nx-e.hx)<=e.wander&&Math.abs(ny-e.hy)<=e.wander&&!(SCN.id==='world'&&(SCN.inter.some(i=>i.kind==='secret'&&i.x===nx&&i.y===ny)))&&(e.kind!=='cat'||true))beginMove(e,d);else e.dir=d;}}
    if(e.mv)stepEnt(e,dt,e.kind==='cat'?.26:.3);
  }
  // prompt
  const f=facing(),hit=busy()?null:(findInter(SCN,P.tx+f[0],P.ty+f[1]));const pr=$('#prompt');
  if(hit){const lab={npc:'Talk',cat:'Pet the cat',ex:'Look',sign:'Read',gate:'Look',secret:'Look closer',term:'Use terminal',safe:'Try the safe',keep:'Pick up',piano:'Play the piano',mail:'Open the mail slot'}[hit.kind];pr.style.display='block';pr.textContent='E: '+lab;}else pr.style.display='none';
}
function render(){
  g=ctx;ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#0d070d';ctx.fillRect(0,0,VW,VH);ctx.imageSmoothingEnabled=false;
  const sc=SCN;if(!sc)return;const WW=sc.w*16,HH=sc.h*16;
  let cx=P.px+8-VW/2,cy=P.py+8-VH/2;cx=WW<=VW?-(VW-WW)/2:Math.max(0,Math.min(WW-VW,cx));cy=HH<=VH?-(VH-HH)/2:Math.max(0,Math.min(HH-VH,cy));cx=Math.round(cx);cy=Math.round(cy);
  if(titleMode){cx=Math.round(Math.max(0,Math.min(WW-VW,480+Math.sin(T*.05)*230-VW/2)));cy=Math.round(Math.max(0,Math.min(HH-VH,250+Math.cos(T*.037)*130-VH/2)));}
  ctx.setTransform(1,0,0,1,-cx,-cy);
  ctx.drawImage(sc.bg,0,0);
  const h=hourNow(),tn=sc.outdoor?tint(h):[0,0,0,0],night=tn[3]>.18;
  if(sc.outdoor&&tn[3]<.2){ctx.globalAlpha=(wx.type==='rain'?.3:.17)*(1-tn[3]*4);for(const c of clouds){const x=c.x-cx,y=c.y-cy;if(x>VW||y>VH||x<-300||y<-150)continue;ctx.drawImage(cloudC,x,y,180*c.s*1.5,80*c.s*1.5);}ctx.globalAlpha=1;}
  if(sc.outdoor){for(const w of sc.waters){if(w[0]*16<cx-16||w[0]*16>cx+VW||w[1]*16<cy-16||w[1]*16>cy+VH)continue;if(Math.floor(T*2+w[0]*3+w[1])%5===0)F('#bfe6f5',w[0]*16+((w[1]*5)%10),w[1]*16+((w[0]*3)%12),3,1);}}
  const list=[];
  for(const d of sc.drawables){if(d.x+ (d.w||16)<cx-8||d.x>cx+VW+8)continue;list.push(d);}
  for(const e of cur)list.push({y:e.py+16,draw:()=>{if(e.kind==='cat')drawCat(Math.round(e.px),Math.round(e.py),e.dir,e.st,e.col,e.pat);else if(!drawPerson(e.pal,Math.round(e.px),Math.round(e.py),e.dir,e.st))char(Math.round(e.px),Math.round(e.py),e.dir,e.st,PALS[e.pal]);}});
  if(!titleMode)list.push({y:P.py+16.5,draw:()=>{if(!drawPerson('player',Math.round(P.px),Math.round(P.py),P.dir,P.st))char(Math.round(P.px),Math.round(P.py),P.dir,P.st,PALS.player);}});
  // keepsakes and secret glints
  for(const it of sc.inter){if(it.kind==='keep'&&!st.found[it.ref]){const col=BFC[it.ref]||'#e58bb8',ox=it.x*16+8,oy=it.y*16+8;list.push({y:it.y*16+15,draw:()=>{butterfly(ox+Math.sin(T*1.3+it.x)*5,oy+Math.cos(T*1.7+it.y)*4-2,T,col,2,null);}});}
    if(it.kind==='secret'&&!st.secrets[it.ref]&&(!sc.outdoor||night)){const s=SECRETS.find(x=>x.id===it.ref);if(s&&s.x!==undefined&&(s.scene!=='world'||night)){const bx=s.x*16+8,by=s.y*16+8;if(sc.id!=='world'&&it.w>1)continue;list.push({y:by+7,draw:()=>{butterfly(bx+Math.sin(T*1.1+s.x)*4,by+Math.cos(T*1.5+s.y)*3,T*.7,'#cfe6ff',1,null);}});}}}
  list.sort((a,b)=>a.y-b.y);for(const d of list)d.draw(T);
  drawFX();
  if(sc.id==='green'){for(let i=0;i<4;i++){const bx=190+i*70+Math.sin(T*.7+i*2)*60,by=130+Math.sin(T*.9+i*3)*40+Math.cos(T*1.3+i)*14,fl=Math.sin(T*18+i*2)>0,c=['#ffb347','#7fc0ea','#ff7aa8','#fff08a'][i];F(c,bx-3,by,3,fl?3:2);F(c,bx+1,by,3,fl?3:2);F('#1a0d18',bx,by,1,2);}}
  ctx.setTransform(1,0,0,1,0,0);
  if(sc.outdoor&&tn[3]<.15)for(const b of birds){const fl=Math.sin(T*14+b.ph)>0;F('#2a2630',b.x,b.y+(fl?0:1),2,1);F('#2a2630',b.x+2,b.y+(fl?1:0),1,1);F('#2a2630',b.x+3,b.y+(fl?0:1),2,1);}
  // weather
  if(sc.outdoor&&wx.type!=='clear'){for(const p of wx.parts){if(wx.type==='rain'){p.y+=_dt*p.s*2.4;p.x-=_dt*.25*p.s;if(p.y>1){p.y=-.05;p.x=Math.random()*1.2;}F('rgba(190,220,255,.65)',p.x*VW,p.y*VH,1,4);}
    else{p.y+=_dt*.16*p.s;p.x+=Math.sin(T*1.5+p.p)*.0016+.0006;if(p.y>1){p.y=-.05;p.x=Math.random();}F('#ffc0d8',p.x*VW,p.y*VH,2,2);F('#ffe0ec',p.x*VW+1,p.y*VH,1,1);}}}
  // night and dusk
  if(sc.outdoor){let a=tn[3],col=tn;if(wx.type==='rain'){a=Math.min(.7,a+.14);}
    if(a>.01){lg.globalCompositeOperation='source-over';lg.clearRect(0,0,VW,VH);lg.fillStyle='rgba('+(col[0]|0)+','+(col[1]|0)+','+(col[2]|0)+','+a+')';lg.fillRect(0,0,VW,VH);lg.globalCompositeOperation='destination-out';
      const lights=sc.lights.concat([{x:P.tx+(P.mv?(P.mv.tx-P.tx)*Math.min(1,P.mv.t):0),y:P.ty+(P.mv?(P.mv.ty-P.ty)*Math.min(1,P.mv.t):0),r:22}]);
      for(const l of lights){const x=l.x*16+8-cx,y=l.y*16+8-cy;if(x<-l.r||y<-l.r||x>VW+l.r||y>VH+l.r)continue;const gr=lg.createRadialGradient(x,y,2,x,y,l.r);gr.addColorStop(0,'rgba(0,0,0,'+Math.min(1,a*1.7)+')');gr.addColorStop(1,'rgba(0,0,0,0)');lg.fillStyle=gr;lg.fillRect(x-l.r,y-l.r,l.r*2,l.r*2);}
      lg.globalCompositeOperation='source-over';ctx.drawImage(lightC,0,0);
      if(a>.2){ctx.globalCompositeOperation='lighter';for(const l of sc.lights){if(!l.warm)continue;const x=l.x*16+8-cx,y=l.y*16+8-cy;if(x<-40||y<-40||x>VW+40||y>VH+40)continue;const gr=ctx.createRadialGradient(x,y,1,x,y,26);gr.addColorStop(0,'rgba(255,200,110,'+a*.22+')');gr.addColorStop(1,'rgba(255,200,110,0)');ctx.fillStyle=gr;ctx.fillRect(x-26,y-26,52,52);}ctx.globalCompositeOperation='source-over';}}}
  if(sc.outdoor){const a=Math.min(.7,tn[3]+(wx.type==='rain'?.14:0));if(a>.2){ctx.globalCompositeOperation='lighter';
    const GL={green:'190,255,210',ward:'210,150,255',screen:'255,190,130',lab:'200,235,255'};
    for(const b of BLD){if(!b.art)continue;const col=GL[b.id]||'255,205,120',bx=b.x*16-cx,by=b.y*16-24-cy;if(bx>VW||by>VH||bx<-220||by<-170)continue;
      for(const l of b.art.lights){const fl=.88+.12*Math.sin(T*3+l[0]*.7);ctx.fillStyle='rgba('+col+','+(a*.8*fl).toFixed(2)+')';ctx.fillRect(bx+l[0],by+l[1],l[2],l[3]);
        const gx=bx+l[0]+l[2]/2,gy=by+l[1]+l[3]/2,rr=Math.max(l[2],l[3])*.9+5;const gr=ctx.createRadialGradient(gx,gy,1,gx,gy,rr);gr.addColorStop(0,'rgba('+col+','+(a*.22).toFixed(2)+')');gr.addColorStop(1,'rgba('+col+',0)');ctx.fillStyle=gr;ctx.fillRect(gx-rr,gy-rr,rr*2,rr*2);}}
    if(sc.ff&&wx.type!=='rain')for(const f of sc.ff){const x=f.x+Math.sin(T*f.sp+f.ph)*10-cx,y=f.y+Math.cos(T*f.sp*.8+f.ph)*8-cy;if(x<-6||y<-6||x>VW+6||y>VH+6)continue;const p=.5+.5*Math.sin(T*2.2+f.ph);ctx.fillStyle='rgba(220,255,120,'+(.25+.5*p).toFixed(2)+')';ctx.fillRect(Math.round(x),Math.round(y),1,1);
      const gr=ctx.createRadialGradient(x,y,0,x,y,5);gr.addColorStop(0,'rgba(200,255,100,'+(.28*p).toFixed(2)+')');gr.addColorStop(1,'rgba(200,255,100,0)');ctx.fillStyle=gr;ctx.fillRect(x-5,y-5,10,10);}
    ctx.globalCompositeOperation='source-over';}}
  if(fade){const a=fade.phase===0?fade.t:1-fade.t;ctx.fillStyle='rgba(13,7,13,'+Math.max(0,Math.min(1,a))+')';ctx.fillRect(0,0,VW,VH);}
}

/* ==================== BOOT ==================== */
function boot(){
  makeTiles();resize();
  const roll=Math.random();setWeather(roll<.6?'clear':(roll<.8?'rain':'petals'));prevWx=wx.type;setWeather('petals');
  setScene('world',30,12,'down');updateCount();
  requestAnimationFrame(frame);
}
const ready=(document.fonts&&document.fonts.load)?Promise.race([document.fonts.load('8px Silkscreen'),new Promise(r=>setTimeout(r,1500))]):Promise.resolve();
ready.then(boot,boot);
</script>
